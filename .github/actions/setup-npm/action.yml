name: 'Setup NPM and Install Dependencies'
description: 'Generic npm setup that handles GitHub Packages registry configuration and dependency installation'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: 'lts/*'
  registry-url:
    description: 'NPM registry URL (e.g., https://npm.pkg.github.com)'
    required: false
    default: 'https://npm.pkg.github.com'

runs:
  using: 'composite'
  steps:
    - name: 📦 Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: 📦 Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
